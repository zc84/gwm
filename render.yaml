services:
  - type: web
    name: gwm-web
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build --workspace @gwm/web
    startCommand: npm run start --workspace @gwm/web
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: CMS_URL
        fromService:
          type: web
          name: gwm-cms
          property: host
      - key: NEXT_PUBLIC_DEFAULT_LOCALE
        value: en
      - key: NEXT_PUBLIC_SUPPORTED_LOCALES
        value: en,ar
      - key: NEXT_PUBLIC_AI_ASSISTANT_ENABLED
        value: "false"
      - key: NEXT_PUBLIC_STATIC_RAG_ENABLED
        value: "true"

  - type: web
    name: gwm-cms
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build --workspace @gwm/cms
    startCommand: npm run start --workspace @gwm/cms
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gwm-postgres
          property: connectionString
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: PAYLOAD_PUBLIC_SERVER_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_TEMPERATURE
        value: "0.3"
      - key: OPENAI_MAX_TOKENS
        value: "800"

databases:
  - name: gwm-postgres
    plan: starter
    databaseName: gwm
    user: gwm
